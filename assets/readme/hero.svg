<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Director Motorcycle Cinema — 导演摩托电影院：女人、摩托、城市光线</title>
  <desc id="desc">暗色私人放映厅风标题：Director Motorcycle Cinema，副标题女人、摩托、城市光线，五十位导演的电影语法；右侧是电影胶片条，三格画面分别是红灯笼古城、霓虹雨夜与窗前猫影。</desc>

  <g id="bg">
    <rect width="1200" height="360" rx="26" fill="#11100e"/>
  </g>

  <g id="title-block" font-family="Georgia, 'Times New Roman', serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#a99d8c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">PRIVATE SCREENING ROOM · 私人放映厅</text>
    <text x="56" y="128" font-size="52" font-weight="400" fill="#f4efe5">Director Motorcycle</text>
    <text x="56" y="178" font-size="52" font-weight="400" fill="#f4efe5">Cinema</text>
    <text x="56" y="220" font-size="20" fill="#a99d8c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">女人、摩托、城市光线 — 50 位导演启发下的电影语法</text>
    <g id="chips" font-size="18" fill="#f4efe5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <g><rect x="56" y="248" width="150" height="36" rx="18" fill="#1d1a16" stroke="#3a352e" stroke-width="1.5"/><text x="131" y="272">100 张画作</text></g>
      <g><rect x="218" y="248" width="150" height="36" rx="18" fill="#1d1a16" stroke="#3a352e" stroke-width="1.5"/><text x="293" y="272">50 位导演</text></g>
      <g><rect x="380" y="248" width="150" height="36" rx="18" fill="#1d1a16" stroke="#3a352e" stroke-width="1.5"/><text x="455" y="272">摩托 × 猫窗</text></g>
    </g>
  </g>

  <g id="filmstrip">
    <g id="strip-body">
      <rect x="760" y="48" width="384" height="264" rx="14" fill="#1d1a16" stroke="#3a352e" stroke-width="2"/>
    </g>
    <g id="sprockets" fill="#0f0e0c">
      <rect x="772" y="64" width="14" height="10" rx="2"/>
      <rect x="772" y="112" width="14" height="10" rx="2"/>
      <rect x="772" y="160" width="14" height="10" rx="2"/>
      <rect x="772" y="208" width="14" height="10" rx="2"/>
      <rect x="772" y="256" width="14" height="10" rx="2"/>
      <rect x="1118" y="64" width="14" height="10" rx="2"/>
      <rect x="1118" y="112" width="14" height="10" rx="2"/>
      <rect x="1118" y="160" width="14" height="10" rx="2"/>
      <rect x="1118" y="208" width="14" height="10" rx="2"/>
      <rect x="1118" y="256" width="14" height="10" rx="2"/>
    </g>
    <g id="frame-1">
      <rect x="798" y="60" width="306" height="52" rx="8" fill="#7a1f1a"/>
      <circle cx="830" cy="86" r="12" fill="#e8b04b"/>
      <circle cx="868" cy="86" r="12" fill="#e8b04b"/>
      <rect x="930" y="70" width="120" height="42" rx="4" fill="#2b2118"/>
      <text x="798" y="130" font-size="14" fill="#f4efe5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">张艺谋 · 红灯笼古城</text>
    </g>
    <g id="frame-2">
      <rect x="798" y="142" width="306" height="52" rx="8" fill="#1d2b4a"/>
      <text x="798" y="212" font-size="14" fill="#f4efe5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">王家卫 · 霓虹雨夜</text>
      <rect x="830" y="152" width="10" height="32" fill="#e5484d"/>
      <rect x="852" y="152" width="10" height="32" fill="#00f0ff"/>
      <rect x="874" y="152" width="10" height="32" fill="#f2d484"/>
      <circle cx="1010" cy="168" r="14" fill="#f4efe5" opacity="0.9"/>
    </g>
    <g id="frame-3">
      <rect x="798" y="224" width="306" height="52" rx="8" fill="#24382e"/>
      <rect x="830" y="234" width="60" height="32" rx="4" fill="#0f0e0c"/>
      <circle cx="860" cy="250" r="9" fill="#e8b04b"/>
      <text x="798" y="294" font-size="14" fill="#f4efe5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">猫窗系列 · 窗前猫影</text>
    </g>
  </g>
</svg>
